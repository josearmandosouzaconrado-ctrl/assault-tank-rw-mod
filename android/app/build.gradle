plugins {
    id 'com.android.application'
}

android {
    namespace 'com.guerrafria.mundoaberto'
    compileSdk 34

    defaultConfig {
        applicationId 'com.guerrafria.mundoaberto'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // O jogo (HTML5) fica em /web e é empacotado como assets do APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para poder instalar direto no celular.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
