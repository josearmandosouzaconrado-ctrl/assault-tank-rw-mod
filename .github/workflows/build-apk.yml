name: Gerar APK

on:
  push:
    paths-ignore:
      - 'piratas-godot/**'
      - '.github/workflows/piratas-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/GuerraFria-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: GuerraFria-APK
          path: dist/*.apk

      - name: Publicar Release (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Guerra Fria v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            APK do jogo **Guerra Fria: Mundo Aberto**.
            Baixe o arquivo `.apk` abaixo no celular Android e instale (permita "instalar apps desconhecidos").
